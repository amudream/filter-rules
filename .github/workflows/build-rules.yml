name: Build cross-platform rules

on:
  push:
    paths:
      - "source/**"
      - "scripts/build_rules.py"
      - ".github/workflows/build-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Generate Quantumult X and Mihomo rules
        run: python scripts/build_rules.py
      - name: Commit generated files when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuantumultX Mihomo
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "build: regenerate client rule sets"
            git push
          fi
